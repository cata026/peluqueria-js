<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Inicio de Sesión - RAVKOSMOS</title>
  <link rel="stylesheet" href="../css/iniciosesion.css" />
</head>
<body>
  <div class="contenedor">
  <div class="lado-izquierdo">
    <img src="../imagenes/registro.jpg">
  </div>
  <div class="lado-derecho">
  <div class="iniciosesion">
    <h2>Registro de Usuario</h2>
    <form id="formRegistro">
      <input type="text" id="nombreRegistro" placeholder="Nombre Completo" required />
      <input type="email" id="emailRegistro" placeholder="Correo electrónico" required />
      <input type="password" id="contrasenaRegistro" placeholder="Contraseña" required />
      <input type="tel" id="telefonoRegistro" placeholder="Telefono" required />
      <button type="submit" class="boton">Registrarse</button>
    </form>
    <p id="mensajeLogin" class="mensaje"></p>
    <p>¿Ya tenés cuenta? <a href="iniciosesion.html">Iniciar sesión</a></p>
  </div>
  </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../script.js"></script>
</body>
</html>
