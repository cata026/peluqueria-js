<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Peluquería Debora World</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<header class="header-principal">
  <div class="logo-container">
    <img src="../imagenes/Logo.png" alt="Logo DeboraWorld">
  </div>
  <div class="contenedor-derecha">
    <nav class="navegador">
      <div class="menu-links" id="menuLinks">
        <a href="inicio.html">Inicio</a>
        <a href="servicios.html">Servicios</a>
        <a href="galeria.html">Galeria</a>
        <a href="nosotros.html">Sobre Nosotros</a>
        <a href="index.html">Reservas Online</a>
        <a href="contacto.html">Contacto</a>
      </div>
    </nav>

    <button class="loginlinks">
      <a  id="loginlinks" href="iniciosesion.html">Iniciar Sesión</a>
    </button>

  </div>
</header>

<main>

    <h2>Reservar Turno</h2>

    <form id="formTurno">

        <input type="text" id="nombre" placeholder="Tu nombre" required>

        <label>Elegí un servicio:</label>

        <input type="text" id="buscador" placeholder="Buscar servicio (ej: Corte)...">

        <div id="contenedor-servicios" class="servicios"></div>

        <input type="date" id="fecha" required>
        <input type="time" id="hora" required>

        <button id="boton" type="submit">Reservar Turno</button>

    </form>

    <button id="botonproxturno" type="button">Tus Proximos Turnos →</button>

</main>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="../main.js"></script>

</body>
</html>
