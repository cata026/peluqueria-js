<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Debora World</title>
    <link rel="stylesheet" href="../css/contacto.css">
</head>
<body>

    <section class="contacto-section">
        <div class="contacto-container">
            
            <div class="contacto-form">
                <h2>Envianos un mensaje</h2>
                <p>¿Tenés alguna duda? Escribinos y te responderemos lo antes posible.</p>
                
                <form id="formContacto">
                    <div class="input-group">
                        <input type="text" placeholder="Nombre completo" required>
                    </div>
                    <div class="input-group">
                        <input type="email" placeholder="Correo electrónico" required>
                    </div>
                    <div class="input-group">
                        <textarea placeholder="¿En qué podemos ayudarte?" rows="5" required></textarea>
                    </div>
                    <button type="submit" class="btn-enviar">Enviar Mensaje</button>
                </form>
            </div>

            <div class="contacto-info">
                <div class="info-card">
                    <h3>📍 Ubicación</h3>
                    <p>Calle Falsa 123, Berazategui, Buenos Aires</p>
                </div>
                
                <div class="info-card">
                    <h3>📞 Teléfono</h3>
                    <p>+54 11 1234-5678</p>
                </div>

                <div class="info-card">
                    <h3>📱 Redes Sociales</h3>
                    <div class="redes">
                        <a href="#">Instagram</a>
                        <a href="#">WhatsApp</a>
                    </div>
                </div>

                <a href="index.html" class="btn-volver-contacto">← Volver al Inicio</a>
            </div>

        </div>
    </section>

</body>
</html>
